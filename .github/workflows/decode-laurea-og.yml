name: Decode laurea OG image
on:
  push:
    branches: [main]
    paths:
      - laurea-alida-sau/og-image.b64
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit PNG
        run: |
          base64 -d laurea-alida-sau/og-image.b64 > laurea-alida-sau/og-image.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add laurea-alida-sau/og-image.png
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Add og-image.png for the Alida Sau invitation"
          git push
